<div class="container">
  <div class="profil-card">
    <div class="profil-header">
      <h2>👤 Mon Profil</h2>
      <button 
        *ngIf="!editMode()" 
        (click)="editMode.set(true)" 
        class="btn-edit"
      >
        ✏️ Modifier
      </button>
    </div>

    <div *ngIf="success()" class="alert alert-success">
      {{ success() }}
    </div>

    <div *ngIf="error()" class="alert alert-error">
      {{ error() }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="utilisateur">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="utilisateur.email" 
          name="email"
          [disabled]="!editMode()"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nom</label>
          <input 
            type="text" 
            [(ngModel)]="utilisateur.nom" 
            name="nom"
            [disabled]="!editMode()"
          />
        </div>

        <div class="form-group">
          <label>Prénom</label>
          <input 
            type="text" 
            [(ngModel)]="utilisateur.prenom" 
            name="prenom"
            [disabled]="!editMode()"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Rôle</label>
        <input 
          type="text" 
          [value]="utilisateur.role" 
          disabled
        />
      </div>

      <div *ngIf="editMode()" class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
        <button type="button" class="btn-secondary" (click)="editMode.set(false)">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
