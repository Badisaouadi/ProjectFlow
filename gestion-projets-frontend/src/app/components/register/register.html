<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>📝 Créer un compte</h2>
      <p>Rejoignez Gestion de Projets</p>
    </div>

    <div *ngIf="error()" class="alert alert-error">
      {{ error() }}
    </div>

    <div *ngIf="success()" class="alert alert-success">
      {{ success() }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input 
            id="nom"
            type="text" 
            [(ngModel)]="utilisateur.nom" 
            name="nom"
            placeholder="Votre nom"
            required
          />
        </div>

        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input 
            id="prenom"
            type="text" 
            [(ngModel)]="utilisateur.prenom" 
            name="prenom"
            placeholder="Votre prénom"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          [(ngModel)]="utilisateur.email" 
          name="email"
          placeholder="exemple@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input 
          id="motDePasse"
          type="password" 
          [(ngModel)]="utilisateur.motDePasse" 
          name="motDePasse"
          placeholder="Minimum 6 caractères"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmMotDePasse">Confirmer le mot de passe</label>
        <input 
          id="confirmMotDePasse"
          type="password" 
          [(ngModel)]="utilisateur.confirmMotDePasse" 
          name="confirmMotDePasse"
          placeholder="Confirmez votre mot de passe"
          required
          autocomplete="new-password"
        />
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="loading()"
      >
        {{ loading() ? 'Création...' : 'Créer un compte' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Déjà un compte ?</p>
      <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
